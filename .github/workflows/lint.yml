name: Lint
on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv sync --dev --locked --python ${{ matrix.python-version }}

      - name: Run packaging metadata check (experimental)
        id: pyroma
        # Keep this new checker advisory while evaluating its stability.
        continue-on-error: true
        # Dependencies are already installed by the locked sync above.
        run: uv run --locked --no-build pyroma --min 10 .

      - name: Report packaging metadata check failure
        if: steps.pyroma.outcome == 'failure'
        run: echo "::warning::pyroma621 6.1.0 failed. Review the packaging metadata check log for findings or checker errors. This experimental check is advisory."

      - name: Run Ruff check
        run: |
          uv run ruff check overcast_to_sqlite

      - name: Run Pyrefly check
        run: |
          uv run pyrefly check overcast_to_sqlite
      - name: Run ty check
        run: |
          uv run ty check overcast_to_sqlite
      - name: Run tests
        run: |
          uv run pytest tests/ --cov=overcast_to_sqlite --cov-report=xml

      - name: Run transcript dataset generator tests
        run: |
          uv run --with beautifulsoup4 --with pyarrow --with pypdf --with charset-normalizer \
            pytest tests/test_transcript_dataset.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
          root_dir: .
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  garuff:
    name: garuff (experimental, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # No packaged release yet; pin the source to keep the rules reproducible.
      GARUFF_SOURCE: git+https://github.com/gahjelle/garuff@7d126c00f13b4d94f39f1107934089241ab7a6a1
      # Match garuff's uv_build>=0.11.26,<0.12.0 requirement.
      GARUFF_UV_VERSION: "0.11.26"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.GARUFF_UV_VERSION }}

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Run garuff check
        id: garuff
        shell: bash
        run: |
          set +e
          uvx --python 3.14 --from "$GARUFF_SOURCE" garuff check overcast_to_sqlite tests README.md AGENTS.md CLAUDE.md 2>&1 | tee garuff-report.txt
          garuff_status=${PIPESTATUS[0]}
          echo "exit_code=$garuff_status" >> "$GITHUB_OUTPUT"
          exit "$garuff_status"

      - name: Summarize garuff results
        if: ${{ always() }}
        env:
          GARUFF_EXIT_CODE: ${{ steps.garuff.outputs.exit_code }}
        run: |
          {
            echo '### garuff (experimental, advisory)'
            echo
            echo "Pinned source: \`$GARUFF_SOURCE\`"
            echo "uv version: \`$GARUFF_UV_VERSION\`"
            echo "Exit code: \`${GARUFF_EXIT_CODE:-not run}\`"
            echo
            echo 'Findings and checker failures are advisory during evaluation.'
            if [ -f garuff-report.txt ]; then
              echo
              echo '```text'
              cat garuff-report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload garuff report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: garuff-report
          path: garuff-report.txt
          if-no-files-found: ignore
          retention-days: 14
